<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Virtual PC</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,Segoe UI,sans-serif;
    background:#080b12;
    color:#fff;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

#desktop{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 75% 20%,#304b7d 0,transparent 32%),
        radial-gradient(circle at 15% 80%,#19365b 0,transparent 38%),
        linear-gradient(135deg,#080b12,#101a2d);
}

/* ÍCONES */

.icons{
    position:absolute;
    top:18px;
    left:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.icon{
    width:85px;
    padding:8px;
    text-align:center;
    border:0;
    border-radius:10px;
    color:white;
    background:transparent;
}

.icon:hover{
    background:#ffffff18;
}

.icon .emoji{
    font-size:36px;
}

.icon span{
    display:block;
    margin-top:5px;
    font-size:12px;
}

/* TASKBAR */

.taskbar{
    position:absolute;
    z-index:9999;
    left:0;
    right:0;
    bottom:0;
    height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px;
    background:#080c14ee;
    backdrop-filter:blur(18px);
    border-top:1px solid #ffffff15;
}

.start{
    width:44px;
    height:44px;
    border:0;
    border-radius:10px;
    background:#ffffff12;
    color:white;
    font-size:25px;
}

.start:hover{
    background:#ffffff22;
}

.tasks{
    flex:1;
    display:flex;
    gap:5px;
}

.task{
    height:42px;
    padding:0 14px;
    border:0;
    border-radius:9px;
    background:#ffffff0c;
    color:white;
}

.task:hover{
    background:#ffffff1c;
}

.clock{
    padding:10px;
    color:#bbc4d2;
    font-size:13px;
}

/* START MENU */

.startMenu{
    position:absolute;
    z-index:10000;
    left:10px;
    bottom:65px;
    width:330px;
    padding:18px;
    border-radius:16px;
    background:#0c121eee;
    backdrop-filter:blur(20px);
    border:1px solid #ffffff15;
    box-shadow:0 20px 70px #0009;
}

.startMenu.hidden{
    display:none;
}

.startMenu h2{
    margin:0 0 14px;
}

.startApp{
    width:100%;
    padding:12px;
    margin:3px 0;
    border:0;
    border-radius:9px;
    background:transparent;
    color:white;
    text-align:left;
}

.startApp:hover{
    background:#ffffff12;
}

/* JANELAS */

.window{
    position:absolute;
    z-index:20;
    width:760px;
    height:520px;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    background:#0c1119;
    border:1px solid #ffffff18;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 25px 80px #000b;
}

.window.maximized{
    left:0!important;
    top:0!important;
    width:100%!important;
    height:calc(100% - 58px)!important;
    transform:none!important;
    border-radius:0;
}

.titlebar{
    height:43px;
    display:flex;
    align-items:center;
    padding:0 8px 0 12px;
    background:#111824;
    cursor:move;
}

.title{
    flex:1;
    font-size:14px;
}

.windowButtons{
    display:flex;
    gap:3px;
}

.windowButtons button{
    width:32px;
    height:30px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:white;
}

.windowButtons button:hover{
    background:#ffffff15;
}

.windowContent{
    height:calc(100% - 43px);
    overflow:hidden;
}

/* NAVEGADOR */

.browser{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.browserBar{
    display:flex;
    gap:6px;
    padding:8px;
    background:#151d29;
}

.browserBar button{
    width:38px;
    border:0;
    border-radius:7px;
    background:#ffffff10;
    color:white;
}

.browserBar button:hover{
    background:#ffffff20;
}

.url{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    border-radius:8px;
    padding:9px 12px;
    background:#080d15;
    color:white;
}

.browserPage{
    flex:1;
    border:0;
    width:100%;
    background:white;
}

/* TERMINAL */

.terminal{
    height:100%;
    padding:15px;
    background:#05070a;
    color:#dce5f2;
    font-family:Consolas,monospace;
    overflow:auto;
}

.terminalOutput{
    white-space:pre-wrap;
    line-height:1.5;
}

.terminalLine{
    display:flex;
    align-items:center;
}

.prompt{
    color:#62e6a5;
    white-space:nowrap;
}

.terminalInput{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-family:Consolas,monospace;
}

/* NOTAS */

.notes{
    width:100%;
    height:100%;
    padding:12px;
    background:#101620;
}

.notes textarea{
    width:100%;
    height:100%;
    resize:none;
    border:0;
    outline:0;
    border-radius:8px;
    padding:15px;
    background:#080c12;
    color:white;
}

/* ARQUIVOS */

.files{
    padding:20px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
}

.file{
    width:105px;
    padding:14px 8px;
    text-align:center;
    border-radius:10px;
}

.file:hover{
    background:#ffffff12;
}

.fileIcon{
    font-size:42px;
    margin-bottom:7px;
}

.fileName{
    font-size:12px;
}

/* SOBRE */

.about{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.logo{
    width:90px;
    height:90px;
    display:grid;
    place-items:center;
    border-radius:22px;
    font-size:45px;
    background:linear-gradient(135deg,#715cff,#24b8ff);
    margin-bottom:18px;
}

.about h1{
    margin:0 0 8px;
}

.about p{
    color:#aab4c4;
}

/* RESPONSIVO */

@media(max-width:850px){
    .window{
        width:calc(100% - 20px);
        height:calc(100% - 80px);
    }

    .startMenu{
        width:280px;
    }

    .clock{
        display:none;
    }
}
</style>
</head>

<body>

<div id="desktop">

    <!-- ÍCONES -->

    <div class="icons">

        <button class="icon" onclick="openApp('browser')">
            <div class="emoji">🌐</div>
            <span>Navegador</span>
        </button>

        <button class="icon" onclick="openApp('files')">
            <div class="emoji">📁</div>
            <span>Arquivos</span>
        </button>

        <button class="icon" onclick="openApp('terminal')">
            <div class="emoji">💻</div>
            <span>Terminal</span>
        </button>

        <button class="icon" onclick="openApp('notes')">
            <div class="emoji">📝</div>
            <span>Notas</span>
        </button>

        <button class="icon" onclick="openApp('about')">
            <div class="emoji">⚙️</div>
            <span>Sistema</span>
        </button>

    </div>

    <!-- JANELAS -->

    <div id="windows"></div>

    <!-- MENU INICIAR -->

    <div id="startMenu" class="startMenu hidden">

        <h2>🖥️ Virtual PC</h2>

        <button class="startApp" onclick="openApp('browser')">
            🌐 Navegador
        </button>

        <button class="startApp" onclick="openApp('files')">
            📁 Explorador de arquivos
        </button>

        <button class="startApp" onclick="openApp('terminal')">
            💻 Terminal
        </button>

        <button class="startApp" onclick="openApp('notes')">
            📝 Bloco de notas
        </button>

        <button class="startApp" onclick="openApp('about')">
            ⚙️ Sistema
        </button>

    </div>

    <!-- BARRA -->

    <div class="taskbar">

        <button class="start" onclick="toggleStart()">⊞</button>

        <div id="tasks" class="tasks"></div>

        <div id="clock" class="clock"></div>

    </div>

</div>

<script>

const opened = {};
let currentZ = 50;

const appInfo = {

    browser:{
        title:"🌐 Navegador",
        icon:"🌐"
    },

    files:{
        title:"📁 Explorador de arquivos",
        icon:"📁"
    },

    terminal:{
        title:"💻 Terminal",
        icon:"💻"
    },

    notes:{
        title:"📝 Notas",
        icon:"📝"
    },

    about:{
        title:"⚙️ Sistema",
        icon:"⚙️"
    }

};

/* RELÓGIO */

function updateClock(){

    const d = new Date();

    document.getElementById("clock").textContent =
        d.toLocaleTimeString("pt-BR",{
            hour:"2-digit",
            minute:"2-digit"
        });
}

updateClock();
setInterval(updateClock,1000);

/* START */

function toggleStart(){

    document
        .getElementById("startMenu")
        .classList.toggle("hidden");
}

/* ABRIR APP */

function openApp(app){

    document
        .getElementById("startMenu")
        .classList.add("hidden");

    if(opened[app]){

        opened[app].style.display = "block";

        bringToFront(opened[app]);

        return;
    }

    createWindow(app);
}

/* CRIAR JANELA */

function createWindow(app){

    const win = document.createElement("div");

    win.className = "window";

    win.dataset.app = app;

    win.innerHTML = `

        <div class="titlebar">

            <div class="title">
                ${appInfo[app].title}
            </div>

            <div class="windowButtons">

                <button onclick="minimizeApp('${app}')">
                    −
                </button>

                <button onclick="maximizeApp('${app}')">
                    □
                </button>

                <button onclick="closeApp('${app}')">
                    ×
                </button>

            </div>

        </div>

        <div class="windowContent">
            ${getContent(app)}
        </div>
    `;

    document
        .getElementById("windows")
        .appendChild(win);

    opened[app] = win;

    createTaskButton(app);

    bringToFront(win);

    if(app === "browser"){
        setupBrowser(win);
    }

    if(app === "terminal"){
        setupTerminal(win);
    }

    if(app === "notes"){
        setupNotes(win);
    }

    makeDraggable(win);
}

/* CONTEÚDO */

function getContent(app){

    if(app === "browser"){

        return `

            <div class="browser">

                <div class="browserBar">

                    <button onclick="browserBack()">
                        ←
                    </button>

                    <button onclick="browserForward()">
                        →
                    </button>

                    <button onclick="browserReload()">
                        ↻
                    </button>

                    <input
                        id="urlInput"
                        class="url"
                        placeholder="Digite um site ou pesquise..."
                    >

                    <button onclick="navigate()">
                        Ir
                    </button>

                </div>

                <iframe
                    id="browserFrame"
                    class="browserPage"
                    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts"
                ></iframe>

            </div>
        `;
    }

    if(app === "files"){

        return `

            <div class="files">

                <div class="file">
                    <div class="fileIcon">📁</div>
                    <div class="fileName">Documentos</div>
                </div>

                <div class="file">
                    <div class="fileIcon">📁</div>
                    <div class="fileName">Downloads</div>
                </div>

                <div class="file">
                    <div class="fileIcon">📁</div>
                    <div class="fileName">Imagens</div>
                </div>

                <div class="file">
                    <div class="fileIcon">📄</div>
                    <div class="fileName">README.txt</div>
                </div>

                <div class="file">
                    <div class="fileIcon">📄</div>
                    <div class="fileName">config.txt</div>
                </div>

            </div>
        `;
    }

    if(app === "terminal"){

        return `

            <div class="terminal">

                <div
                    id="terminalOutput"
                    class="terminalOutput"
                >VirtualPC Terminal
Versão 1.0

Digite "help" para ver os comandos.

</div>

                <div class="terminalLine">

                    <span class="prompt">
                        user@virtualpc:~$
                    </span>

                    <input
                        id="terminalInput"
                        class="terminalInput"
                        autocomplete="off"
                        spellcheck="false"
                    >

                </div>

            </div>
        `;
    }

    if(app === "notes"){

        return `

            <div class="notes">

                <textarea
                    id="notesArea"
                    placeholder="Digite suas anotações..."
                ></textarea>

            </div>
        `;
    }

    if(app === "about"){

        return `

            <div class="about">

                <div class="logo">
                    🖥️
                </div>

                <h1>Virtual PC</h1>

                <p>
                    Sistema virtual rodando no navegador.
                </p>

                <p>
                    Versão 1.0
                </p>

            </div>
        `;
    }

    return "";
}

/* TASKBAR */

function createTaskButton(app){

    const button = document.createElement("button");

    button.className = "task";

    button.dataset.task = app;

    button.textContent =
        appInfo[app].icon + " " +
        appInfo[app].title.replace(/^.{2}/,"");

    button.onclick = () => {

        if(!opened[app]) return;

        if(opened[app].style.display === "none"){

            opened[app].style.display = "block";

            bringToFront(opened[app]);

        }else{

            bringToFront(opened[app]);

        }

    };

    document
        .getElementById("tasks")
        .appendChild(button);
}

/* JANELA */

function bringToFront(win){

    currentZ++;

    win.style.zIndex = currentZ;
}

function minimizeApp(app){

    if(opened[app]){
        opened[app].style.display = "none";
    }
}

function closeApp(app){

    if(!opened[app]) return;

    opened[app].remove();

    delete opened[app];

    const task =
        document.querySelector(
            `[data-task="${app}"]`
        );

    if(task){
        task.remove();
    }
}

function maximizeApp(app){

    const win = opened[app];

    if(!win) return;

    win.classList.toggle("maximized");

    bringToFront(win);
}

/* ARRASTAR */

function makeDraggable(win){

    const bar =
        win.querySelector(".titlebar");

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    bar.addEventListener("mousedown",e=>{

        if(e.target.closest("button")) return;

        if(win.classList.contains("maximized")) return;

        dragging = true;

        const rect =
            win.getBoundingClientRect();

        offsetX =
            e.clientX - rect.left;

        offsetY =
            e.clientY - rect.top;

        bringToFront(win);
    });

    document.addEventListener("mousemove",e=>{

        if(!dragging) return;

        win.style.left =
            (e.clientX - offsetX) + "px";

        win.style.top =
            (e.clientY - offsetY) + "px";

        win.style.transform = "none";
    });

    document.addEventListener("mouseup",()=>{

        dragging = false;

    });
}

/* NAVEGADOR */

function setupBrowser(win){

    const input =
        win.querySelector("#urlInput");

    input.addEventListener("keydown",e=>{

        if(e.key === "Enter"){
            navigate();
        }

    });

    input.value = "https://www.google.com";

    loadURL(input.value);
}

function loadURL(url){

    const frame =
        document.querySelector("#browserFrame");

    if(!frame) return;

    frame.src = url;
}

function navigate(){

    const input =
        document.querySelector("#urlInput");

    if(!input) return;

    let value =
        input.value.trim();

    if(!value) return;

    if(
        !value.startsWith("http://") &&
        !value.startsWith("https://")
    ){

        if(
            value.includes(".") &&
            !value.includes(" ")
        ){

            value = "https://" + value;

        }else{

            value =
                "https://www.google.com/search?q=" +
                encodeURIComponent(value);

        }
    }

    input.value = value;

    loadURL(value);
}

function browserBack(){

    const frame =
        document.querySelector("#browserFrame");

    if(!frame) return;

    try{
        frame.contentWindow.history.back();
    }catch(e){}
}

function browserForward(){

    const frame =
        document.querySelector("#browserFrame");

    if(!frame) return;

    try{
        frame.contentWindow.history.forward();
    }catch(e){}
}

function browserReload(){

    const frame =
        document.querySelector("#browserFrame");

    if(!frame) return;

    try{
        frame.contentWindow.location.reload();
    }catch(e){

        frame.src = frame.src;

    }
}

/* TERMINAL */

function setupTerminal(win){

    const input =
        win.querySelector("#terminalInput");

    input.focus();

    input.addEventListener("keydown",e=>{

        if(e.key !== "Enter") return;

        const command =
            input.value.trim();

        input.value = "";

        executeCommand(command);

    });
}

function executeCommand(command){

    const output =
        document.querySelector("#terminalOutput");

    if(!output) return;

    let result = "";

    switch(command.toLowerCase()){

        case "help":

            result =
`Comandos:

help     - mostra os comandos
clear    - limpa o terminal
date     - mostra a data
time     - mostra a hora
whoami   - mostra o usuário
about    - informações do sistema
ls       - lista arquivos
echo     - escreve uma mensagem`;

            break;

        case "clear":

            output.textContent = "";

            return;

        case "date":

            result =
                new Date().toLocaleDateString("pt-BR");

            break;

        case "time":

            result =
                new Date().toLocaleTimeString("pt-BR");

            break;

        case "whoami":

            result = "user";

            break;

        case "about":

            result =
                "Virtual PC 1.0";

            break;

        case "ls":

            result =
`Desktop
Documents
Downloads
Pictures
README.txt
config.txt`;

            break;

        default:

            if(command.toLowerCase().startsWith("echo ")){

                result =
                    command.substring(5);

            }else if(command === ""){

                result = "";

            }else{

                result =
                    "Comando não encontrado: " +
                    command;
            }
    }

    output.textContent +=
        "\nuser@virtualpc:~$ " +
        command +
        "\n" +
        result +
        "\n";

    const terminal =
        document.querySelector(".terminal");

    if(terminal){

        terminal.scrollTop =
            terminal.scrollHeight;
    }
}

/* NOTAS */

function setupNotes(win){

    const area =
        win.querySelector("#notesArea");

    try{

        area.value =
            localStorage.getItem(
                "virtualpc_notes"
            ) || "";

    }catch(e){}

    area.addEventListener("input",()=>{

        try{

            localStorage.setItem(
                "virtualpc_notes",
                area.value
            );

        }catch(e){}

    });
}

/* ABRIR NAVEGADOR AO CLICAR */

document.addEventListener("dblclick",e=>{

    const icon =
        e.target.closest(".icon");

    if(icon){
        return;
    }

});

</script>

</body>
</html>
